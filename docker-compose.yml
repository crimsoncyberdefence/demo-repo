services:
  backend:
    build: ./backend
    image: your-dockerhub-username/backend-app:v1
    container_name: backend
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: your-dockerhub-username/frontend-app:v1
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
